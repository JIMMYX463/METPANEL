<!doctype html><html><body><iframe id=f style="position:absolute;left:-9999px;width:900px;height:600px"></iframe><script>
// GRAMET-START
// Ogimet no permite leer su página desde otro sitio, pero sí cargar la imagen. Su nombre es
// /tmp/gramet_<petición AAAAMMDDhhmmss>_<pasada AAAAMMDDhh>_<ruta>_<inicio AAAAMMDDhh>_<fin AAAAMMDDhh>.png
// Se pide la página en un iframe oculto y se prueban los nombres posibles alrededor de la hora de la petición.
function findGramet(route,hini,hfin,t0,t1){
  const D=t=>new Date(t).toISOString().replace(/[-T:]/g,"");
  const HR=3600000,base=Math.floor(t0/HR)*HR,st=D(base+hini*HR).slice(0,10),en=D(base+hfin*HR).slice(0,10);
  const r0=Math.floor((t0-3.5*HR)/(6*HR))*6*HR,runs=[r0,r0-6*HR,r0+6*HR,r0-12*HR].filter(r=>r<=t0).map(r=>D(r).slice(0,10));
  const secs=[];for(let t=Math.floor(t0/1000)-4;t<=Math.ceil(t1/1000)+3;t++)secs.push(D(t*1000).slice(0,14));
  const tryList=urls=>new Promise(res=>{let left=urls.length,done=false;urls.forEach(u=>{const i=new Image();i.onload=()=>{if(!done){done=true;res(u);}};i.onerror=()=>{if(--left===0&&!done)res(null);};i.src=u+"?r="+Date.now();});});
  const pass=async()=>{for(const r of runs){const u=await tryList(secs.map(x=>"https://www.ogimet.com/tmp/gramet_"+x+"_"+r+"_"+route+"_"+st+"_"+en+".png"));if(u)return u;}return null;};
  return (async()=>{for(let k=0;k<5;k++){if(k)await new Promise(r=>setTimeout(r,800));const u=await pass();if(u)return u;}return null;})();
}

async function run(route,hini,hfin){const t0=Date.now();const fr=document.getElementById('f');
 await new Promise(r=>{fr.onload=r;fr.src="https://www.ogimet.com/display_gramet.php?icao="+route+"&hini="+hini+"&tref="+Math.floor(t0/1000)+"&hfin="+hfin+"&fl=230&enviar=Enviar";});
 const t1=Date.now();const u=await findGramet(route,hini,hfin,t0,t1);return {route,hini,hfin,secs:(t1-t0)/1000,u,total:(Date.now()-t0)/1000};}
</script></body></html>
