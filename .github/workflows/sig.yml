name: Telegram (inicio de sesión y prueba)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "login = iniciar sesión en Telegram (solo la primera vez) · fetch = descargar mapas"
        type: choice
        options: [fetch, login]
        default: fetch

permissions:
  contents: write
  issues: write

concurrency:
  group: metar
  cancel-in-progress: false

jobs:
  sig:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q telethon cryptography pillow && sudo apt-get install -y -qq tesseract-ocr >/dev/null 2>&1 || true
      - name: Telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_PHONE: ${{ secrets.TG_PHONE }}
          TG_2FA: ${{ secrets.TG_2FA }}
          GH_TOKEN: ${{ github.token }}
          SOLO_COLORES: ${{ github.event.schedule == '47 * * * *' && '1' || '' }}
        run: python3 scripts/tg_sig.py "${{ github.event.inputs.modo || 'fetch' }}"
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "Mapa significativo $(date -u +%d%H%MZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            sleep $((i*4))
          done
          exit 1
