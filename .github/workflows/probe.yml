name: Prueba (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: git fetch -q origin preview && git checkout -q origin/preview -- index.html
      - run: |
          npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 1; mkdir shots
          cat > t.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();
          const p=await b.newPage({viewport:{width:1400,height:1000},deviceScaleFactor:1});
          p.on('pageerror',e=>console.log('ERR',e.message));
          await p.goto('http://localhost:8765/index.html?v=x');await p.waitForTimeout(6000);
          const ops=await p.$('.ops');await ops.scrollIntoViewIfNeeded();await p.waitForTimeout(3000);
          await ops.screenshot({path:'shots/ops.png'});
          await p.evaluate(()=>dMap.setView([38.9,-6.6],8));await p.waitForTimeout(3000);await (await p.$('#dMap')).screenshot({path:'shots/bz8.png'});
          await p.evaluate(()=>dMap.setView([37.0,-6.6],9));await p.waitForTimeout(3000);await (await p.$('#dMap')).screenshot({path:'shots/sur9.png'});
          const pt=await p.evaluate(()=>{const c=dMap.latLngToContainerPoint([37.0,-6.72]);const r=dMap.getContainer().getBoundingClientRect();return [r.left+c.x,r.top+c.y];});
          await p.mouse.click(pt[0],pt[1]);await p.waitForTimeout(1200);
          console.log('ntm',await p.$eval('#ntmTitle',e=>e.textContent),await p.$eval('#ntm',e=>e.hidden));
          await p.screenshot({path:'shots/modal.png'});
          await p.keyboard.press('Escape');
          await p.click('#zTypes button[data-t="R"]');await p.waitForTimeout(800);
          console.log('R pressed',await p.$eval('#zTypes button[data-t="R"]',e=>e.getAttribute('aria-pressed')));
          await b.close();})();
          JS
          node t.js
          cd shots && git init -q -b probe-img && git add . && git -c user.name=bot -c user.email=bot@x commit -qm img && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-img
