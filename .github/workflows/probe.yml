name: Prueba (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for f in insignia/rest/services/NOTAM_SRV insignia/rest/services/AIS insignia/rest/services/INSIGNIA_SRV insignias/rest/services/NOTAM insignias/rest/services/INSIGNIA_VIGOR insignias/rest/services/AIP insignias/rest/services/INSIGNIA_AIRAC insignias/rest/services/INSIGNIA_VFR; do
            echo "=== $f"; curl -sS -m 60 "https://servais.enaire.es/$f?f=json" | python3 -c "import sys,json;d=json.load(sys.stdin);print([s['name']+':'+s['type'] for s in d.get('services',[])])"
          done
