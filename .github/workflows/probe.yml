name: Prueba (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1; mkdir shots
          cat > t.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const ctx=await b.newContext({viewport:{width:1400,height:1000}});const p=await ctx.newPage();
          const log=pg=>{pg.on('request',r=>{if(r.method()==='POST')console.log('REQ',r.url().slice(-60),(r.postData()||'').slice(0,700).replace(/\n/g,' '))});
            pg.on('response',async r=>{if(r.request().method()==='POST'&&/eaup|Eaup|EAUP/i.test(r.url())){try{const t=await r.text();console.log('RESP',r.url().slice(-40),t.length,t.slice(0,4000).replace(/\n/g,' '))}catch(e){}}});};
          log(p);ctx.on('page',pg=>{console.log('POPUP');log(pg);});
          await p.goto('https://www.public.nm.eurocontrol.int/PUBPORTAL/gateway/spec/index.html',{waitUntil:'networkidle',timeout:90000});
          await p.waitForTimeout(6000);
          console.log('=====CLICK');
          const h=await p.evaluateHandle(()=>{const xs=[...document.querySelectorAll('a,div,span,td')].filter(e=>/^\d\d\/\d\d\/\d{4} \d\d:\d\d$/.test(e.innerText.trim())&&e.children.length===0&&/E?UUP|E?AUP/.test((e.closest('tr')||{}).innerText||''));return xs[0];});
          console.log('TARGET',await h.evaluate(e=>e&&e.closest('tr').innerText));
          const [pop]=await Promise.all([ctx.waitForEvent('page',{timeout:30000}).catch(()=>null),h.asElement().click()]);
          const q=pop||p;await q.waitForTimeout(15000);
          const info=await q.evaluate(()=>{const t=document.body.innerText;const m=t.match(/Type\s+(\S+)\s+Valid WEF\s+(\S+ \S+)\s+Valid TIL\s+(\S+ \S+)\s+Released On\s+(\S+ \S+)/);return m?m.slice(1):null;});
          console.log('INFO',JSON.stringify(info));
          const rows=await q.evaluate(()=>[...document.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>td.innerText.trim())).filter(r=>r.length>=8&&/^L[EP]/.test(r[0])));
          console.log('NROWS',rows.length);rows.slice(0,80).forEach(r=>console.log('ROW',JSON.stringify(r)));
          const hdr=await q.evaluate(()=>[...document.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>td.innerText.trim())).filter(r=>r.includes('MNM FL')).slice(0,3));console.log('HDR',JSON.stringify(hdr));
          const tabs=await q.evaluate(()=>[...document.querySelectorAll('div,td,a')].filter(e=>e.children.length===0&&/RSA Allocations|ATS Route|RAD Activations/.test(e.innerText)).map(e=>e.tagName+':'+e.innerText.trim()));console.log('TABS',JSON.stringify(tabs));
          await b.close();})();
          JS
          node t.js
          cd shots && git init -q -b probe-img && git add . && git -c user.name=bot -c user.email=bot@x commit -qm img && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-img
