name: Prueba GRAMET (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd .github/probe && npm init -y >/dev/null && npm i playwright@1.56.1 2>&1 | tail -1 && npx playwright install --with-deps chromium 2>&1 | tail -1
          cat > m.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const p=await b.newPage();
          await p.goto('file://'+process.cwd()+'/t.html');
          for(const a of [["LEBZ_LPBJ",0,2],["LEBZ",1,3]]){console.log(JSON.stringify(await p.evaluate(a=>run(...a),a)));
          const fr=p.frames().find(f=>f.url().includes('display_gramet'));console.log('real', fr?await fr.evaluate(()=>[...document.images].map(i=>i.src+' '+i.naturalWidth).join(' | ')):'no frame');
          console.log('cand', await p.evaluate(()=>window.__c&&window.__c.slice(0,3).join(' ')));}
          await b.close();})();
          JS
          node m.js
