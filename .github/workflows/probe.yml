name: Prueba GRAMET (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd .github/probe && npm init -y >/dev/null && npm i playwright@1.56.1 2>&1 | tail -1 && npx playwright install --with-deps chromium 2>&1 | tail -1
          cat > m.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const p=await b.newPage();
          await p.goto('file://'+process.cwd()+'/t.html');
          for(const a of [["LEBZ_LPBJ",0,2],["LEBZ",1,3],["LEBZ_LEMO",2,5],["LEMO",0,2],["LEBZ_LPBJ",3,6],["LPBJ",0,1],["LEBZ_LEMO",0,2],["LEMO",1,4],["LEBZ_LPBJ",1,3],["LEBZ",0,2]]){console.log(JSON.stringify(await p.evaluate(a=>run(...a),a)));}
          await b.close();})();
          JS
          node m.js
