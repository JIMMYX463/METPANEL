name: Prueba fuentes NOTAM (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probar
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for u in \
            "https://www.notaminfo.com/" \
            "https://metarcentral.com/airport/LEBZ/notam" \
            "https://acukwik.com/NOTAMs/LEBZ" \
            "https://notambriefing.com/fir/madrid" \
            "https://www.notams.faa.gov/dinsQueryWeb/queryRetrievalMapAction.do?reportType=Raw&retrieveLocId=LEBZ&actionType=notamRetrievalByICAOs" \
            "https://notampib.enaire.es/" ; do
            echo "=================== $u"
            curl -sS -L -m 30 -A "$UA" -o /tmp/p.html -w "HTTP %{http_code} · %{size_download} bytes · %{url_effective}\n" "$u" || echo "fallo de conexión"
            python3 - <<'PY'
          import re,html
          try: t=open('/tmp/p.html',errors='ignore').read()
          except: t=''
          ids=sorted(set(re.findall(r'\b[A-Z]\d{4}/\d{2}\b',t)))
          print('IDs de NOTAM encontrados:',len(ids),ids[:8])
          txt=re.sub(r'\s+',' ',html.unescape(re.sub(r'<script.*?</script>|<style.*?</style>|<[^>]+>',' ',t,flags=re.S)))
          i=txt.find(ids[0]) if ids else -1
          print('Extracto:',txt[max(0,i-100):i+500] if i>=0 else txt[:400])
          PY
          done
