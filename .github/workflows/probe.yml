name: Prueba RDT (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir out; cd out
          get(){ curl -sS -m 90 "https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.3.0&request=GetMap&layers=$1&styles=$2&format=image/png&transparent=true&crs=EPSG:4326&bbox=$3&width=900&height=600" -o "$4.png"; file "$4.png"; }
          P="33.8,-14,46.2,4.6"; E="25,-30,55,15"
          get mtg_fd:ir105_hrfi mtg_fd:mtg_fd_ir105_hrfi_style_02 $P ir_pen
          get msg_fes:rdt msg_fes:rdt_black $P rdtk_pen
          get msg_fes:rdt msg_fes:rdt_white $P rdtw_pen
          get mtg_fd:ir105_hrfi mtg_fd:mtg_fd_ir105_hrfi_style_02 $E ir_eu
          get msg_fes:rdt msg_fes:rdt_black $E rdtk_eu
          get msg_fes:rdt msg_fes:rdt_white $E rdtw_eu
          git init -q -b probe-img && git add . && git -c user.name=bot -c user.email=bot@x commit -qm img
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-img
