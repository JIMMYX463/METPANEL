name: Prueba (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: git fetch -q origin preview && git checkout -q origin/preview -- index.html
      - run: |
          npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 1; mkdir shots
          cat > t.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();
          for(const theme of ['light','dark']){
            const p=await b.newPage({viewport:{width:1400,height:1000},deviceScaleFactor:1,colorScheme:theme});
            p.on('pageerror',e=>console.log('ERR',e.message));p.on('console',m=>{if(m.type()==='error')console.log('CONSOLE',m.text())});
            await p.goto('http://localhost:8765/index.html?v=x');await p.waitForTimeout(6000);
            const ops=await p.$('.ops');await ops.scrollIntoViewIfNeeded();await p.waitForTimeout(3000);
            await ops.screenshot({path:`shots/ops_${theme}.png`});
            if(theme==='light'){
              await p.click('#dBz');await p.waitForTimeout(2500);await (await p.$('#dMap')).screenshot({path:'shots/dmap_bz.png'});
              await p.click('.secpin >> nth=2');await p.waitForTimeout(2000);await p.screenshot({path:'shots/sector3.png'});
              console.log('title',await p.$eval('#gramTitle',e=>e.textContent));
              await p.keyboard.press('Escape');
              await p.click('.drow >> nth=0');await p.waitForTimeout(1500);await p.screenshot({path:'shots/notam.png'});
              console.log('ntm',await p.$eval('#ntmTitle',e=>e.textContent));
            }
            await p.close();}
          const m=await b.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});await m.goto('http://localhost:8765/index.html?v=x');await m.waitForTimeout(5000);
          const o=await m.$('.ops');await o.scrollIntoViewIfNeeded();await m.waitForTimeout(2500);await o.screenshot({path:'shots/mobile.png'});
          await b.close();})();
          JS
          node t.js
          cd shots && git init -q -b probe-img && git add . && git -c user.name=bot -c user.email=bot@x commit -qm img && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-img
