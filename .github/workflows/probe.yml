name: Prueba EUMETSAT (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; B="35.0,-10,44.6,4.4"
          get(){ curl -sS -m 60 "https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.3.0&request=GetMap&layers=$1&styles=$2&format=image/png&transparent=true&crs=EPSG:4326&bbox=$B&width=600&height=400" -o "out/$3.png"; file "out/$3.png"; }
          get mtg_fd:ir105_hrfi mtg_fd:mtg_fd_ir105_hrfi_style_01 style01
          get mtg_fd:ir105_hrfi mtg_fd:mtg_fd_ir105_hrfi_style_02 style02
          get mtg_fd:ir105_hrfi "" default
          get msg_fes:cth "" cth
      - run: |
          cd out && git init -q -b probe-img && git add . && git -c user.name=bot -c user.email=bot@x commit -qm img
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-img
