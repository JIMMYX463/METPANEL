name: Prueba EUMETSAT (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 60 "https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities" -o cap.xml
          python3 - <<'PY'
          import re
          t=open('cap.xml',encoding='utf-8',errors='ignore').read()
          names=re.findall(r'<Layer[^>]*>\s*<Name>([^<]+)</Name>\s*<Title>([^<]*)</Title>',t)
          print(len(names),'capas')
          for n,ti in names:
              if re.search(r'prec|rain|h60|h63|mpe|rdt|crr|convect|ir108|rgb_natural|true',n+ti,re.I): print(n,'|',ti)
          PY
