name: Prueba (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          A="https://servais.enaire.es/insignias/rest/services/INSIGNIA_VIGOR/Aero_APP_VIGOR_Airspace_V_6/MapServer/4/query"
          curl -sS -m 120 -G "$A" --data-urlencode "where=1=1" --data-urlencode "outFields=IDENT_TXT,NAME_TXT,TYPE_CODE,WORKHR_CODE,TYPE_CODE_ACTIVITY,NIVELES,DISTVERTLOWER_TXT,DISTVERTUPPER_TXT,REMARKS_TXT_ACTIVITY,CLASS_REMARKS_LIST_POPUP" --data-urlencode "returnGeometry=false" --data-urlencode "f=json" -o a.json
          python3 - <<'PY'
          import json,collections
          F=json.load(open('a.json')).get('features',[]);print('AIP',len(F))
          A=[f['attributes'] for f in F]
          print(collections.Counter(a['TYPE_CODE'] for a in A))
          print(collections.Counter((a['TYPE_CODE'],a['WORKHR_CODE']) for a in A).most_common(30))
          for t in ['P','R','D','TSA','TRA']:
              xs=[a for a in A if a['TYPE_CODE']==t][:3]
              for a in xs: print(json.dumps(a,ensure_ascii=False)[:700])
          PY
          N="https://servais.enaire.es/insignias/rest/services/NOTAM/NOTAM_APP_V3/FeatureServer/1/query"
          curl -sS -m 120 -G "$N" --data-urlencode "where=qcode LIKE 'R%'" --data-urlencode "outFields=qcode,affectedElement,itemE,LOWER_VAL,UPPER_VAL,fir" --data-urlencode "returnGeometry=false" --data-urlencode "f=json" -o n.json
          python3 - <<'PY'
          import json,collections,re
          F=json.load(open('n.json')).get('features',[]);A=[f['attributes'] for f in F];print('NOTAM R*',len(A))
          print(collections.Counter(a['qcode'] for a in A))
          for q in ['RTCA','RPCA','RRCA','RACA']:
              c=collections.Counter(re.sub(r'\d+','#',(a['affectedElement'] or '?')) for a in A if a['qcode']==q);print(q,c.most_common(15))
              for a in [a for a in A if a['qcode']==q][:3]: print('   ',(a['affectedElement'] or ''),'|',(a['itemE'] or '')[:200].replace('\n',' '))
          PY
