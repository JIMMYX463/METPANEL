name: Prueba EUMETSAT (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          curl -sS -m 120 "https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities" -o caps.xml
          python3 - <<'PY'
          import re
          x=open('caps.xml',encoding='utf-8').read()
          L=[]
          for b in re.findall(r'<Layer queryable="[01]"[^>]*>(.*?)</Layer>',x,re.S):
              n=re.search(r'<Name>(.*?)</Name>',b); t=re.search(r'<Title>(.*?)</Title>',b)
              st=re.findall(r'<Style>\s*<Name>(.*?)</Name>',b)
              if n: L.append(f"{n.group(1)} | {t.group(1) if t else ''} | {','.join(st)}")
          open('out/layers.txt','w').write("\n".join(L))
          print(len(L))
          PY
      - run: |
          cd out && git init -q -b probe-img && git add . && git -c user.name=bot -c user.email=bot@x commit -qm img
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-img
