name: Actualizar METAR y TAF

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar datos
        run: |
          mkdir -p data
          IDS="LEAB,LERI,LEAL,LEAM,LEAS,LECO,LEBZ,LEBL,LEBB,LEBG,LECH,LERL,LECV,LEBA,LEGT,LEGE,LEGA,LEGR,LEHC,LEIB,LEJR,LELN,LEDA,LELO,LEMD,LECU,LEMG,LEMH,LEMO,LEMI,LEPA,LEPP,LERS,LERT,LESA,LELC,LESO,LEXJ,LEST,LEZL,LETL,LETO,LEVC,LEVD,LEVX,LEVT,LEZG,GCFV,GCLP,GCHI,GCGM,GCLA,GCRR,GCXO,GCTS,GECE,GEML,LPBJ"
          UA="METPANEL dashboard (github.com/JIMMYX463/METPANEL)"
          keep() { [ -s "$1.tmp" ] && mv "$1.tmp" "$1" || rm -f "$1.tmp"; }

          # METAR y TAF (aviationweather.gov)
          curl -fsS -A "$UA" "https://aviationweather.gov/api/data/metar?ids=$IDS&format=raw&hours=2" -o data/metar.txt.tmp || true
          keep data/metar.txt
          curl -fsS -A "$UA" "https://aviationweather.gov/api/data/taf?ids=$IDS&format=raw" -o data/taf.txt.tmp || true
          keep data/taf.txt

          # Posiciones de los aeródromos (para marcarlos en el satélite), una vez al día
          if [ ! -s data/stations.json ] || [ $(( $(date +%s) - $(stat -c %Y data/stations.json) )) -gt 86400 ]; then
            curl -fsS -A "$UA" "https://aviationweather.gov/api/data/stationinfo?ids=$IDS&format=json" -o data/stations.json.tmp || true
            keep data/stations.json
          fi

          ls -la data

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "Datos $(date -u +%d%H%MZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            sleep $((i*4))
          done
          exit 1
