name: Actualizar METAR, TAF y NOTAM

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar datos
        run: |
          mkdir -p data
          IDS="LEBZ,LPBJ,LEMO"
          UA="METPANEL dashboard (github.com/JIMMYX463/METPANEL)"
          keep() { [ -s "$1.tmp" ] && mv "$1.tmp" "$1" || rm -f "$1.tmp"; }

          # METAR y TAF (aviationweather.gov)
          curl -fsS -A "$UA" "https://aviationweather.gov/api/data/metar?ids=$IDS&format=raw&hours=3" -o data/metar.txt.tmp || true
          keep data/metar.txt
          curl -fsS -A "$UA" "https://aviationweather.gov/api/data/taf?ids=$IDS&format=raw" -o data/taf.txt.tmp || true
          keep data/taf.txt

          # NOTAM de los tres aeródromos (buscador público de la FAA)
          BUA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -c /tmp/faa.cj -A "$BUA" "https://notams.aim.faa.gov/notamSearch/nsapp.html" -o /dev/null || true
          curl -sS -b /tmp/faa.cj -A "$BUA" -X POST "https://notams.aim.faa.gov/notamSearch/search" \
            -H "Referer: https://notams.aim.faa.gov/notamSearch/nsapp.html" \
            -H "Origin: https://notams.aim.faa.gov" \
            -H "Accept: application/json, text/javascript, */*; q=0.01" \
            -H "X-Requested-With: XMLHttpRequest" \
            --data "searchType=0&designatorsForLocation=$IDS&designatorForAccountable=&latDegrees=&latMinutes=0&latSeconds=0&longDegrees=&longMinutes=0&longSeconds=0&radius=10&sortColumns=5+false&sortDirection=true&designatorForNotamNumberSearch=&notamNumber=&radiusSearchOnDesignator=false&radiusSearchDesignator=&latitudeDirection=N&longitudeDirection=W&freeFormText=&flightPathText=&flightPathDivertAirfields=&flightPathBuffer=4&flightPathIncludeNavaids=true&flightPathIncludeArtcc=false&flightPathIncludeTfr=true&flightPathIncludeRegulatory=false&flightPathResultsType=All+NOTAMs&archiveDate=&archiveDesignator=&offset=0&notamsOnly=false&filters=&minRunwayLength=&minRunwayWidth=&runwaySurfaceTypes=&predefinedAbraka=&predefinedDabra=&flightPathAddlBuffer=&recaptchaToken=" \
            -w "\nHTTP %{http_code}\n" -o data/notam.json.tmp || true
          head -c 300 data/notam.json.tmp || true
          if jq -e '.notamList' data/notam.json.tmp >/dev/null 2>&1; then keep data/notam.json; else rm -f data/notam.json.tmp; fi

          ls -la data

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Datos $(date -u +%d%H%MZ)" && git push)
