name: Actualizar METAR y TAF

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar datos
        run: |
          mkdir -p data
          IDS="LEBZ,LPBJ,LEMO"
          UA="METPANEL dashboard (github.com/JIMMYX463/METPANEL)"
          keep() { [ -s "$1.tmp" ] && mv "$1.tmp" "$1" || rm -f "$1.tmp"; }

          # METAR y TAF (aviationweather.gov)
          curl -fsS -A "$UA" "https://aviationweather.gov/api/data/metar?ids=$IDS&format=raw&hours=3" -o data/metar.txt.tmp || true
          keep data/metar.txt
          curl -fsS -A "$UA" "https://aviationweather.gov/api/data/taf?ids=$IDS&format=raw" -o data/taf.txt.tmp || true
          keep data/taf.txt

          ls -la data

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Datos $(date -u +%d%H%MZ)" && git push)
