name: Actualizar METAR y TAF

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar METAR y TAF
        run: |
          mkdir -p data
          IDS="LEBZ,LPBJ,LEMO"
          UA="METPANEL dashboard (github.com/JIMMYX463/METPANEL)"
          curl -fsS -A "$UA" "https://aviationweather.gov/api/data/metar?ids=$IDS&format=raw&hours=3" -o data/metar.tmp
          curl -fsS -A "$UA" "https://aviationweather.gov/api/data/taf?ids=$IDS&format=raw" -o data/taf.tmp
          # solo sustituir si llegó algo
          [ -s data/metar.tmp ] && mv data/metar.tmp data/metar.txt || rm -f data/metar.tmp
          [ -s data/taf.tmp ] && mv data/taf.tmp data/taf.txt || rm -f data/taf.tmp
          cat data/metar.txt data/taf.txt || true

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "METAR/TAF $(date -u +%d%H%MZ)" && git push)
